<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="kim so yeon" />
  <title>Genesis Concept Car Gallery</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="main-page">
  <header class="gallery-header">
    <h1>Genesis Concept Car Gallery</h1>
    <p>Publisher · kim so yeon</p>
  </header>

  <main class="carousel" aria-label="Genesis vehicle carousel">
    <div class="carousel-track" id="carouselTrack"></div>
    <button class="carousel-arrow prev" id="prevBtn" aria-label="Previous slide"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
    <button class="carousel-arrow next" id="nextBtn" aria-label="Next slide"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
    <div class="carousel-dots" id="carouselDots" aria-label="Slide pagination"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
